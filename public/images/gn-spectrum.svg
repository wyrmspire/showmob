<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 850" role="img" aria-labelledby="title desc"><title id="title">Electromagnetic spectrum overview</title><desc id="desc">Frequency and photon energy increase from radio to gamma; wavelength decreases. Bands are schematic.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#526777"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ed"/><g font-family="Arial, sans-serif" fill="#142e3c"><text x="28" y="44" font-size="27">One spectrum, different interactions</text><text x="28" y="78" font-size="18">Schematic order · boundaries are not to scale</text><rect x="45" y="130" width="560" height="83" rx="7" fill="#d8e4e9" stroke="#526777" stroke-width="2"/><text x="61" y="159" font-size="21">Radio + microwaves</text><text x="61" y="187" font-size="17">Antennas, links, radar, astronomy</text><rect x="45" y="229" width="560" height="83" rx="7" fill="#d9e6d8" stroke="#526777" stroke-width="2"/><text x="61" y="258" font-size="21">Infrared</text><text x="61" y="286" font-size="17">Thermal sensing, optical links</text><rect x="45" y="328" width="560" height="83" rx="7" fill="#ece4ba" stroke="#526777" stroke-width="2"/><text x="61" y="357" font-size="21">Visible</text><text x="61" y="385" font-size="17">Vision, imaging and lighting</text><rect x="45" y="427" width="560" height="83" rx="7" fill="#e8d7c3" stroke="#526777" stroke-width="2"/><text x="61" y="456" font-size="21">Ultraviolet</text><text x="61" y="484" font-size="17">Fluorescence and lithography</text><rect x="45" y="526" width="560" height="83" rx="7" fill="#e4d6e2" stroke="#526777" stroke-width="2"/><text x="61" y="555" font-size="21">X-rays</text><text x="61" y="583" font-size="17">Imaging and diffraction</text><rect x="45" y="625" width="560" height="83" rx="7" fill="#d7d5e8" stroke="#526777" stroke-width="2"/><text x="61" y="654" font-size="21">Gamma rays</text><text x="61" y="682" font-size="17">Nuclear processes and astronomy</text><path d="M648 145 L648 700" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)"/><text x="28" y="770" font-size="19">Downward: frequency ↑  |  photon energy ↑  |  wavelength ↓</text><text x="28" y="806" font-size="18">X-ray and gamma energy ranges overlap; origin also matters.</text></g></svg>