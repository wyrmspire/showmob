<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1130" role="img" aria-labelledby="title desc"><title id="title">Wafer fabrication process loop</title><desc id="desc">Upstream supply feeds repeated wafer processing with measurement and hold decisions, followed by interconnect, testing and packaging.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#526777"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ed"/><g font-family="Arial, sans-serif" fill="#142e3c"><text x="28" y="44" font-size="30">The route repeats</text><text x="28" y="78" font-size="20">Operations recur for structures and layers.</text><rect x="185" y="120" width="390" height="82" rx="7" fill="#e3ebea" stroke="#526777" stroke-width="2"/><text x="201" y="149" font-size="21">Wafer + design inputs</text><text x="201" y="177" font-size="17">Prepared substrate and pattern data</text><path d="M380 202 L380 248" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="185" y="260" width="390" height="82" rx="7" fill="#e3ebea" stroke="#526777" stroke-width="2"/><text x="201" y="289" font-size="21">Add material</text><text x="201" y="317" font-size="17">Deposition or growth</text><path d="M380 342 L380 375" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="185" y="387" width="390" height="82" rx="7" fill="#e3ebea" stroke="#526777" stroke-width="2"/><text x="201" y="416" font-size="21">Define a pattern</text><text x="201" y="444" font-size="17">Coat, expose, develop</text><path d="M380 469 L380 502" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="185" y="514" width="390" height="106" rx="7" fill="#e3ebea" stroke="#526777" stroke-width="2"/><text x="201" y="543" font-size="21">Transfer / modify / clean</text><text x="201" y="571" font-size="17">Etch, implant or related processing</text><text x="201" y="595" font-size="17">Sequence depends on the structure</text><path d="M380 620 L380 657" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="185" y="669" width="390" height="82" rx="7" fill="#e3ebea" stroke="#526777" stroke-width="2"/><text x="201" y="698" font-size="21">Measure and inspect</text><text x="201" y="726" font-size="17">Release, hold or disposition</text><path d="M185 710 H65 V302 H185" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)"/><text x="28" y="815" font-size="19">Repeat for the next structure or layer</text><path d="M575 710 L635 710" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="635" y="658" width="110" height="107" rx="7" fill="#f8e4d2" stroke="#526777" stroke-width="2"/><text x="650" y="691" font-size="19">HOLD</text><text x="645" y="721" font-size="15">Investigate</text><path d="M380 751 L380 850" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="135" y="862" width="490" height="106" rx="7" fill="#e3ebea" stroke="#526777" stroke-width="2"/><text x="151" y="891" font-size="21">Complete the device and connections</text><text x="151" y="919" font-size="17">Contacts and repeated interconnect layers</text><text x="151" y="943" font-size="17">Then wafer electrical test</text><path d="M380 968 L380 1003" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="135" y="1015" width="490" height="82" rx="7" fill="#d4e1cb" stroke="#526777" stroke-width="2"/><text x="151" y="1044" font-size="21">Package and final test</text><text x="151" y="1072" font-size="17">Electrical, thermal and mechanical integration</text></g></svg>