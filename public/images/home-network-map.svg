<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">A home network: inside, the router, and outside</title>
  <desc id="desc">Four devices with private addresses sit inside one subnet, 192.168.1.0/24. Every device reaches the outside through the router, which has an inside address, 192.168.1.1, and an outside address, 203.0.113.7. The internet sees only the outside address.</desc>
  <defs>
    <style>
      .bg{fill:#111817}.zone{fill:#1d2926;stroke:#80cdb8;stroke-width:3}.dev{fill:#24332f;stroke:#80cdb8;stroke-width:2}.router{fill:#302820;stroke:#e9a96c;stroke-width:3}.net{fill:#1a2230;stroke:#8fb3e9;stroke-width:3}.line{fill:none;stroke:#80cdb8;stroke-width:5}.wan{fill:none;stroke:#8fb3e9;stroke-width:5}.direct{fill:none;stroke:#80cdb8;stroke-width:3;stroke-dasharray:7 6}.label{fill:#f6f4ed;font:700 30px system-ui,sans-serif}.detail{fill:#d2dcd8;font:26px ui-monospace,Menlo,monospace}.small{fill:#e9a96c;font:700 22px system-ui,sans-serif;letter-spacing:.08em}.note{fill:#c3cfca;font:24px system-ui,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="640" height="900" rx="26"/>
  <text class="small" x="40" y="52">INSIDE: ONE SUBNET</text>
  <rect class="zone" x="30" y="70" width="580" height="400" rx="22"/>
  <text class="label" x="56" y="116">192.168.1.0/24</text>
  <rect class="dev" x="56" y="140" width="250" height="100" rx="14"/><text class="label" x="76" y="182">Laptop</text><text class="detail" x="76" y="220">192.168.1.23</text>
  <rect class="dev" x="334" y="140" width="250" height="100" rx="14"/><text class="label" x="354" y="182">Phone</text><text class="detail" x="354" y="220">192.168.1.31</text>
  <rect class="dev" x="56" y="264" width="250" height="100" rx="14"/><text class="label" x="76" y="306">Smart plug</text><text class="detail" x="76" y="344">192.168.1.40</text>
  <rect class="dev" x="334" y="264" width="250" height="100" rx="14"/><text class="label" x="354" y="306">Pi</text><text class="detail" x="354" y="344">192.168.1.50</text>
  <path class="direct" d="M306 190 H334 M306 314 H334"/>
  <path class="direct" d="M56 412 H106"/><text class="note" x="118" y="420">neighbors talk directly</text>
  <path class="line" d="M320 470 V540"/>
  <text class="note" x="338" y="515">all devices exit here</text>
  <rect class="router" x="130" y="540" width="380" height="150" rx="20"/>
  <text class="label" x="150" y="582">Router</text>
  <text class="note" x="150" y="624">inside</text><text class="detail" x="250" y="624">192.168.1.1</text>
  <text class="note" x="150" y="664">outside</text><text class="detail" x="250" y="664">203.0.113.7</text>
  <path class="wan" d="M320 690 V750"/>
  <text class="small" x="40" y="740">OUTSIDE</text>
  <rect class="net" x="130" y="750" width="380" height="120" rx="60"/>
  <text class="label" x="258" y="800">Internet</text>
  <text class="note" x="178" y="842">sees only 203.0.113.7</text>
</svg>
