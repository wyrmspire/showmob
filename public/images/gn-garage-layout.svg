<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 930" role="img" aria-labelledby="title desc"><title id="title">One-car garage planning layout</title><desc id="desc">Approximate 12 by 20 foot room with machine envelopes and a central path; service clearances must be confirmed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#526777"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ed"/><g font-family="Arial, sans-serif" fill="#142e3c"><text x="28" y="42" font-size="27">Plan the room around movement</text><text x="28" y="73" font-size="18">Example only · north / rear wall at top</text><rect x="130" y="160" width="360" height="600" rx="7" fill="#fffdf8" stroke="#526777" stroke-width="2"/><path d="M130 125 L490 125" fill="none" stroke="#526777" stroke-width="2.5"/><path d="M130 116 L130 135" fill="none" stroke="#526777" stroke-width="2.5"/><path d="M490 116 L490 135" fill="none" stroke="#526777" stroke-width="2.5"/><text x="277" y="114" font-size="20">12 ft</text><path d="M95 160 L95 760" fill="none" stroke="#526777" stroke-width="2.5"/><text x="24" y="460" font-size="20">20 ft</text><rect x="250" y="185" width="210" height="60" rx="7" fill="#e1d2b7" stroke="#526777" stroke-width="2"/><text x="284" y="222" font-size="18">Bench / inspect</text><rect x="137" y="170" width="90" height="105" rx="7" fill="#f8e4d2" stroke="#526777" stroke-width="2" stroke-dasharray="8 6"/><text x="146" y="197" font-size="17">Panel</text><text x="145" y="223" font-size="16">service</text><text x="145" y="246" font-size="16">zone</text><rect x="145" y="325" width="135" height="240" rx="7" fill="none" stroke="#526777" stroke-width="2" stroke-dasharray="8 6"/><rect x="152" y="360" width="62" height="168" rx="7" fill="#c6d8df" stroke="#526777" stroke-width="2"/><text x="158" y="444" font-size="17">Lathe</text><rect x="345" y="325" width="132" height="210" rx="7" fill="none" stroke="#526777" stroke-width="2" stroke-dasharray="8 6"/><rect x="369" y="378" width="90" height="99" rx="7" fill="#c6d8df" stroke="#526777" stroke-width="2"/><text x="396" y="432" font-size="17">Mill</text><rect x="140" y="650" width="100" height="73" rx="7" fill="#e1d2b7" stroke="#526777" stroke-width="2"/><text x="152" y="680" font-size="18">Stock</text><text x="152" y="705" font-size="18">rack</text><path d="M310 710 L310 280" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)"/><text x="284" y="586" font-size="17">Clear</text><text x="284" y="608" font-size="17">route</text><path d="M250 760 L420 760" fill="none" stroke="#526777" stroke-width="2.5"/><text x="275" y="797" font-size="18">Delivery door</text><text x="28" y="845" font-size="17">Solid: equipment footprint. Dashed: assumed envelope.</text><text x="28" y="873" font-size="17">Measure full travel, guarding, stock and service access.</text><text x="28" y="901" font-size="17">This sketch does not establish required clearances.</text></g></svg>