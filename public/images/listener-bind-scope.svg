<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" role="img" aria-labelledby="title desc">
<title id="title">The bind address sets which entrance a service faces</title>
<desc id="desc">Three services on one owned host: loopback-only, LAN-bound, and wildcard. Firewall and routing checks are still needed for network reach.</desc>
<rect width="640" height="820" rx="22" fill="#101b2c"/>
<text x="32" y="52" fill="#eaf4ff" font-family="system-ui,sans-serif" font-size="27" font-weight="700">One machine, three entrances</text>
<text x="32" y="87" fill="#aec4df" font-family="system-ui,sans-serif" font-size="19">Example: your laptop at 192.168.1.23</text>
<g font-family="system-ui,sans-serif">
<rect x="25" y="120" width="590" height="164" rx="18" fill="#213348" stroke="#77d5bf" stroke-width="2"/>
<text x="45" y="157" fill="#77d5bf" font-size="22" font-weight="700">LOOPBACK · this host only</text>
<text x="45" y="198" fill="#fff" font-size="23">127.0.0.1:3000 · preview-app</text>
<text x="45" y="232" fill="#d6e5f6" font-size="19">Another device cannot connect directly.</text>
<text x="45" y="260" fill="#d6e5f6" font-size="17">IPv6 loopback: ::1</text>
<rect x="25" y="302" width="590" height="164" rx="18" fill="#213348" stroke="#f6cc72" stroke-width="2"/>
<text x="45" y="339" fill="#f6cc72" font-size="22" font-weight="700">LAN ADDRESS · this interface</text>
<text x="45" y="380" fill="#fff" font-size="23">192.168.1.23:8080 · app</text>
<text x="45" y="414" fill="#d6e5f6" font-size="19">A LAN device may be able to connect.</text>
<text x="45" y="442" fill="#d6e5f6" font-size="17">Check firewall and routing first.</text>
<rect x="25" y="484" width="590" height="164" rx="18" fill="#213348" stroke="#e9a0a4" stroke-width="2"/>
<text x="45" y="521" fill="#e9a0a4" font-size="22" font-weight="700">WILDCARD · all IPv4 interfaces</text>
<text x="45" y="562" fill="#fff" font-size="23">0.0.0.0:8443 · web-server</text>
<text x="45" y="596" fill="#d6e5f6" font-size="19">May face LAN and other active interfaces.</text>
<text x="45" y="624" fill="#d6e5f6" font-size="17">IPv6 wildcard: :: (check it separately)</text>
<rect x="25" y="674" width="590" height="112" rx="16" fill="#16263a" stroke="#8297b3"/>
<text x="45" y="712" fill="#eaf4ff" font-size="20" font-weight="700">Bind scope ≠ proven network access</text>
<text x="45" y="746" fill="#d6e5f6" font-size="18">Firewall, routing, and interfaces still matter.</text>
<text x="45" y="771" fill="#d6e5f6" font-size="16">This is a local inspection, not a network scan.</text>
</g>
</svg>
