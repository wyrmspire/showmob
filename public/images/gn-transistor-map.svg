<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1080" role="img" aria-labelledby="title desc"><title id="title">Transistor to microprocessor: contribution map</title><desc id="desc">Parallel branches from Bell Labs, Texas Instruments and Fairchild converge in the integrated-circuit and MOS foundations used by Intel and Busicom.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#526777"/></marker></defs><rect width="100%" height="100%" fill="#f8f5ed"/><g font-family="Arial, sans-serif" fill="#142e3c"><text x="28" y="43" font-size="29">From devices to a processor</text><text x="28" y="74" font-size="18">Arrows show contributions, not a complete family tree.</text><rect x="28" y="120" width="330" height="116" rx="7" fill="#e3ebea" stroke="#526777" stroke-width="2"/><text x="44" y="149" font-size="21">BELL LABS · 1947</text><text x="44" y="177" font-size="17">Bardeen + Brattain</text><text x="44" y="201" font-size="17">Point-contact transistor</text><rect x="422" y="120" width="330" height="116" rx="7" fill="#e3ebea" stroke="#526777" stroke-width="2"/><text x="438" y="149" font-size="21">BELL LABS · 1959–60</text><text x="438" y="177" font-size="17">Atalla + Kahng</text><text x="438" y="201" font-size="17">MOS transistor</text><path d="M358 178 L422 178" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="28" y="315" width="330" height="140" rx="7" fill="#e3ebea" stroke="#526777" stroke-width="2"/><text x="44" y="344" font-size="21">TEXAS INSTRUMENTS · 1958</text><text x="44" y="372" font-size="17">Jack Kilby</text><text x="44" y="396" font-size="17">Integrated-circuit</text><text x="44" y="420" font-size="17">demonstration</text><rect x="422" y="315" width="330" height="140" rx="7" fill="#e3ebea" stroke="#526777" stroke-width="2"/><text x="438" y="344" font-size="21">FAIRCHILD · 1959–60</text><text x="438" y="372" font-size="17">Hoerni → planar process</text><text x="438" y="396" font-size="17">Noyce → planar IC concept</text><text x="438" y="420" font-size="17">Last + team → working IC</text><path d="M193 455 L280 565" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M587 455 L500 565" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="170" y="575" width="440" height="113" rx="7" fill="#e3ebea" stroke="#526777" stroke-width="2"/><text x="186" y="604" font-size="21">INTEGRATED CIRCUITS</text><text x="186" y="632" font-size="17">Devices and connections</text><text x="186" y="656" font-size="17">fabricated together</text><path d="M752 178 H770 V743 H610" fill="none" stroke="#526777" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M390 688 L390 744" fill="none" stroke="#526777" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="170" y="752" width="440" height="155" rx="7" fill="#d4e1cb" stroke="#526777" stroke-width="2"/><text x="186" y="781" font-size="21">INTEL + BUSICOM · 1971</text><text x="186" y="809" font-size="17">Hoff + Mazor: architecture</text><text x="186" y="833" font-size="17">Faggin + Shima: implementation</text><text x="186" y="857" font-size="17">4004: CPU on a chip</text><text x="28" y="969" font-size="22">Three questions to follow</text><text x="28" y="1002" font-size="18">What switches?  ·  How is it made?  ·  What does it compute?</text><text x="28" y="1041" font-size="18">A CPU still needs memory, interfaces and a complete system.</text></g></svg>